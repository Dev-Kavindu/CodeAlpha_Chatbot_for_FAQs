name: Sync to Hugging Face spaces
on:
  push:
    branches: [main]
  # මේකෙන් කරන්නේ main branch එකට push කරන හැම වෙලාවකම sync කරන එකයි

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://Kavindu1124:$HF_TOKEN@huggingface.co/spaces/Kavindu1124/DeepScholar-AI main