name: Sync to Hugging Face spaces
on:
  push:
    branches: [main]

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # මුළු history එකම ගන්නවා clean කරන්න ඕන නිසා

      - name: Clean History and Push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. notebooks folder එක සම්පූර්ණයෙන්ම මකන්න
          rm -rf notebooks/

          # 2. දැනට තියෙන .git folder එක (ඉතිහාසය) මකලා අලුතෙන් Git එකක් හදන්න
          rm -rf .git
          git init
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # 3. දැන් තියෙන files ටික විතරක් ඇඩ් කරන්න (ලොකු ඒවා නැහැ දැන්)
          git add .
          git commit -m "Fresh sync to HF without large files"
          
          # 4. බලහත්කාරයෙන් (Force Push) අලුත් එකක් විදිහට යවන්න
          git push --force https://Kavindu1124:$HF_TOKEN@huggingface.co/spaces/Kavindu1124/DeepScholar-AI main