name: Sync to Hugging Face spaces
on:
  push:
    branches: [main]

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      # 1. GitHub එකේ තියෙන කෝඩ් ටික Action Runner එකට ගන්නවා
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # 2. ලොකු ෆයිල්ස් තියෙන ෆෝල්ඩර් එක අයින් කරනවා
      - name: Remove notebooks directory
        run: rm -rf notebooks/

      # 3. Hugging Face එකට පුෂ් කරනවා
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add -A
          # වෙනසක් තියෙනවා නම් විතරක් commit කරනවා
          git diff-index --quiet HEAD || git commit -m "Sync to HF (excluding notebooks)"
          git push --force https://Kavindu1124:$HF_TOKEN@huggingface.co/spaces/Kavindu1124/DeepScholar-AI main